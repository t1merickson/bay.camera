# Netlify deploy config. Static build + one proxy rewrite.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Match the local dev version so a build that passes here passes there.
  NODE_VERSION = "22"

# ops.alertcalifornia.org blocks browser TLS fingerprints (AWS WAF) while
# allowing server-side fetches, so the client hits this same-origin path and
# Netlify proxies it (status 200 = proxy, not redirect). Mirrors the Vite dev
# proxy in astro.config.mjs.
[[redirects]]
  from = "/api/alertca"
  to = "https://ops.alertcalifornia.org/api/getCameraDataByLoc"
  status = 200

# Caching for that path lives in netlify/edge-functions/alertca.ts, not here.
# A [[headers]] block does NOT apply to a proxied response — tried it against
# the live site and the proxy path reported "fwd=miss" on every request while
# static paths reported "stored". The upstream sends no cache directive of its
# own, so without code running at the edge, every visitor triggered a fresh
# 6.65 MB fetch from a public agency's API.
#
# The redirect above stays as the fallback: if the edge function's fetch fails
# it calls context.next() and this answers instead, uncached but working.

# Astro puts a content hash in these filenames, so changing a file changes its
# name. Safe to cache forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
