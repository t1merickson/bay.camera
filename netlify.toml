# Netlify deploy config. Static build plus one function.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Match the local dev version so a build that passes here passes there.
  NODE_VERSION = "22"

# /api/alertca is served by netlify/functions/alertca.mts, which fetches the
# ALERTCalifornia feed server-side, trims it to California, and caches it at
# the CDN for 60 s. It used to be a plain proxy rewrite here plus an edge
# function for caching. Both are gone:
#
# - A [[headers]] block does NOT apply to a proxied response. Tried it against
#   the live site: the proxy path reported "fwd=miss" on every request.
# - Edge Functions cap CPU at 50 ms per request, and trimming 7 MB of JSON
#   takes 16-22 ms even on a fast laptop. Too close to the limit.
#
# There is deliberately no redirect for /api/alertca any more. Netlify's docs
# don't say whether a function's own `path` beats a netlify.toml redirect for
# the same URL, so the function owns the path alone and the question never
# comes up.

# Astro puts a content hash in these filenames, so changing a file changes its
# name. Safe to cache forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
